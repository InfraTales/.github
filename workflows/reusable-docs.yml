# Reusable Documentation Validation Workflow for InfraTales

name: Reusable Docs Validation

on:
  workflow_call:
    inputs:
      check_diagrams:
        description: Validate Mermaid diagrams
        required: false
        type: boolean
        default: true

jobs:
  validate:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required root files
        run: |
          for file in README.md LICENSE CONTRIBUTING.md SECURITY.md; do
            test -f "$file"
          done

      - name: Validate README declarations
        run: |
          grep -Fq "**Repository Type:**" README.md
          grep -Fq "**Status:**" README.md

      - name: Check license wording drift
        run: |
          if grep -q "License: MIT" README.md && grep -q "INFRATALES OPEN SOURCE LICENSE" LICENSE; then
            echo "README implies MIT while LICENSE is custom."
            exit 1
          fi

          if grep -qi "open source" README.md && grep -q "INFRATALES OPEN SOURCE LICENSE" LICENSE; then
            echo "README implies open source while LICENSE is custom."
            exit 1
          fi

      - name: Check repo-type-specific docs
        run: |
          if grep -Fq "Production Reference Implementation" README.md; then
            for file in docs/architecture.md docs/limitations.md docs/cost.md docs/security.md docs/runbook.md docs/troubleshooting.md; do
              test -f "$file"
            done
          fi

      - name: Validate Mermaid diagrams
        if: ${{ inputs.check_diagrams }}
        run: |
          for file in diagrams/architecture.mmd diagrams/sequence.mmd diagrams/dataflow.mmd; do
            test -f "$file"
            first=$(head -1 "$file")
            echo "$first" | grep -qE "^(graph|sequenceDiagram|flowchart|classDiagram|stateDiagram|erDiagram|pie|gantt|journey|mindmap)"
          done

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress '*.md' 'docs/*.md'
          fail: false
        continue-on-error: true
