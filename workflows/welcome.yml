# Welcome new contributors to InfraTales
name: Welcome

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Welcome New Contributor
    runs-on: ubuntu-latest
    
    steps:
      - name: Welcome new PR author
        if: github.event_name == 'pull_request_target'
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |
            👋 Welcome to InfraTales, @${{ github.actor }}!
            
            Thank you for your first pull request! 🎉
            
            ## What happens next?
            
            1. ⏳ Our CI will run automated checks
            2. 👀 A maintainer will review your changes
            3. 💬 We may request some changes or clarifications
            4. ✅ Once approved, we'll merge your contribution!
            
            ## Checklist
            
            Please ensure your PR:
            - [ ] Follows our [contribution guidelines](https://github.com/InfraTales/.github/blob/main/CONTRIBUTING.md)
            - [ ] Has a clear description
            - [ ] Includes tests (if applicable)
            - [ ] Updates documentation (if applicable)
            
            ---
            
            Questions? Tag `@InfraTales/maintainers` or review our [organization standards](https://github.com/InfraTales/.github).
            
            Thanks for contributing to InfraTales public repositories.

      - name: Welcome new issue author
        if: github.event_name == 'issues'
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Welcome to InfraTales, @${{ github.actor }}!
            
            Thank you for opening your first issue! 🎉
            
            ## What happens next?
            
            1. 🏷️ A maintainer will triage and label your issue
            2. 💬 We may ask for more details
            3. 🔧 Someone will work on a fix/feature
            
            ## While you wait
            
            - 📚 Check our [documentation](https://infratales.com/docs)
            - 🔍 Search [existing issues](../../issues) for similar topics
            - 💡 Consider contributing a fix yourself!
            
            ---
            
            Thanks for helping improve InfraTales! 🚀
